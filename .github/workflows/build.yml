name: Build

on:
  push:
    branches:
      - master
      - main
      - dev
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  build:
    name: Test ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86-64
          - arch: aarch64_cortex-a53
            target: mvebu-cortexa53
          - arch: aarch64_generic
            target: armsr-armv8

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine branch name
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BRANCH="${GITHUB_BASE_REF#refs/heads/}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Determine changed packages
        run: |
          PKG_ROOTS=$(find . -mindepth 2 -maxdepth 2 -name Makefile | \
            grep -v ".*/src/Makefile" | \
            sed -e 's@./\(.*\)/Makefile@\1/@')
          
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_REF="origin/${BRANCH}"
          else
            BASE_REF="HEAD^"
          fi
          
          CHANGES=$(git diff --diff-filter=d --name-only $BASE_REF HEAD)

          PACKAGES=""
          for ROOT in $PKG_ROOTS; do
            for CHANGE in $CHANGES; do
              if [[ "$CHANGE" == "$ROOT"* ]]; then
                PACKAGE_NAME=$(echo "$ROOT" | sed -e 's@\(.*\)/@\1@')
                PACKAGES="$PACKAGES $PACKAGE_NAME"
                break
              fi
            done
          done
          
          PACKAGES="${PACKAGES:-luci-app-ssr-plus}"
          PACKAGES=$(echo $PACKAGES | xargs)

          echo "编译插件: $PACKAGES"
          echo "PACKAGES=$PACKAGES" >> $GITHUB_ENV

      - name: Build IPK Packages
        uses: immortalwrt/gh-action-sdk@v7
        env:
          ARCH: ${{ matrix.arch }}
          FEEDNAME: packages_ci
          V: s
          target: ${{ matrix.target }}
          packages: ${{ env.PACKAGES }}

      - name: Copy all IPK to root
        run: |
          find bin/ -type f -name "*.ipk" -exec cp {} . \; || true
          ls -la *.ipk 2>/dev/null || echo "无 ipk 文件"

      - name: Collect metadata
        run: |
          MERGE_ID=$(git rev-parse --short HEAD)
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_ID=$(git rev-parse --short origin/$BRANCH)
            HEAD_ID=$(git rev-parse --short HEAD)
            PRNUMBER=${GITHUB_REF_NAME%/merge}
          else
            BASE_ID=$(git rev-parse --short HEAD^)
            HEAD_ID=$MERGE_ID
            PRNUMBER="push-$MERGE_ID"
          fi
          echo "MERGE_ID=$MERGE_ID" >> $GITHUB_ENV
          echo "BASE_ID=$BASE_ID" >> $GITHUB_ENV
          echo "HEAD_ID=$HEAD_ID" >> $GITHUB_ENV
          echo "PRNUMBER=$PRNUMBER" >> $GITHUB_ENV
          echo "ARCHIVE_NAME=${{ matrix.arch }}-$PRNUMBER" >> $GITHUB_ENV

      - name: Generate metadata
        run: |
          shopt -s nullglob
          IPKS=( *.ipk )
          cat << EOF > PKG-INFO
          Metadata-Version: 2.1
          Name: ${{ env.ARCHIVE_NAME }}
          Version: $BRANCH
          Author: $GITHUB_ACTOR
          Home-page: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY
          Summary: $PACKAGES
          Platform: ${{ matrix.arch }}

          Modified packages:
          $(for p in $PACKAGES; do echo "  $p"; done)

          Package count: ${#IPKS[@]}
          EOF

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}-packages
          path: |
            *.ipk
            PKG-INFO
